name: Apply daily spending limit update

on:
  push:
    paths:
      - '.github/workflows/daily-limit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update daily spending limit logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);$('#addedMetric').textContent=money(added);$('#remainingMetric').textContent=money(available);$('#remainingMetric').className='metric '+(available>=0?'good':'bad');$('#daysMetric').textContent=days;$('#dailyLimit').textContent=money(days?Math.max(0,available)/days:0);$('#budgetProgress').style.width=Math.min(100,Math.max(0,spent/Math.max(1,state.budget+added)*100))+'%';"
          new = "const todayBudgetTx=currentDate?activeTx().filter(t=>t.countBudget&&t.date===currentDate):[],todaySpent=todayBudgetTx.filter(t=>t.type!=='added').reduce((a,t)=>a+t.amount,0),todayAdded=todayBudgetTx.filter(t=>t.type==='added').reduce((a,t)=>a+t.amount,0),startOfDayAvailable=available+todaySpent-todayAdded,startOfDayLimit=days?Math.max(0,startOfDayAvailable)/days:0,todayRemaining=Math.max(0,startOfDayLimit-todaySpent+todayAdded);$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);$('#addedMetric').textContent=money(added);$('#remainingMetric').textContent=money(available);$('#remainingMetric').className='metric '+(available>=0?'good':'bad');$('#daysMetric').textContent=days;$('#dailyLimit').textContent=money(todayRemaining);$('#budgetProgress').style.width=Math.min(100,Math.max(0,spent/Math.max(1,state.budget+added)*100))+'%';"
          if old not in s:
              raise SystemExit('Expected renderBudget line not found; no change made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name 'Budget App Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Make daily spending limit count down during day'
          git push

# Triggered after workflow creation.
