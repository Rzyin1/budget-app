name: Update Work revision sold metric

on:
  push:
    paths:
      - '.github/workflows/integrate-work.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace RO Bonus with Revision Sold
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          w = Path('work.html')
          s = w.read_text()
          s = s.replace('<div class="muted">RO Bonus</div><div class="metric good" id="bonus"></div>', '<div class="muted">Revision Sold</div><div class="metric good" id="bonus"></div>')
          s = s.replace("$('#bonus').textContent=money(ro*BONUS);", "$('#bonus').textContent=ros.filter(x=>Number(x.revSold)).length;")
          w.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('work.html?v=20260930-edit-visible-2', 'work.html?v=20260930-revision-sold')
          s = s.replace('work.html?v=20260930-edit', 'work.html?v=20260930-revision-sold')
          s = s.replace('src="work.html"', 'src="work.html?v=20260930-revision-sold"')
          p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Replace RO bonus with revision sold count"
            git push
          fi
