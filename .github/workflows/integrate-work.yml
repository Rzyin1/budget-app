name: Integrate Work page

on:
  push:
    paths:
      - '.github/workflows/integrate-work.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Work tab to Budget Tracker
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); s=s.replace("Spending · Statements · Graphs · Savings · Debt · Cornhole · Calendar · History · To Buy · Bills · Smokes","Spending · Statements · Graphs · Savings · Debt · Cornhole · Calendar · History · To Buy · Bills · Smokes · Work"); marker="  <div id=\"status\" class=\"sub status\" aria-live=\"polite\"></div>"; section="  <section class=\"page hidden\" id=\"workPage\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <iframe id=\"workFrame\" src=\"work.html\" title=\"Work Tracker\" style=\"width:100%;height:calc(100vh - 155px);min-height:760px;border:0;background:var(--bg)\"></iframe>\n    </div>\n  </section>\n\n"; s=s if "id=\"workPage\"" in s else s.replace(marker,section+marker,1); old="<button data-page=\"smokesPage\">Smokes</button></nav>"; new="<button data-page=\"smokesPage\">Smokes</button><button data-page=\"workPage\">Work</button></nav>"; s=s if "data-page=\"workPage\"" in s else s.replace(old,new,1); p.write_text(s)'
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Work tab to main budget app"
            git push
          fi
