name: Calendar bill rollover and budget percentage

on:
  push:
    paths:
      - '.github/workflows/lock-daily-allowance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar and budget summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_html='<div><div class="muted">Money Spent</div><div class="metric" id="spentMetric"></div></div>'
          new_html='<div><div class="muted">Money Spent</div><div class="metric" id="spentMetric"></div><div class="muted" id="budgetUsedMetric"></div></div>'
          if old_html not in s:
              raise SystemExit('Money Spent metric target not found')
          s=s.replace(old_html,new_html,1)

          old_budget="$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);$('#addedMetric').textContent=money(added);"
          new_budget="$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);const budgetBase=state.budget+added,budgetUsedPct=budgetBase>0?(spent/budgetBase*100):0;$('#budgetUsedMetric').textContent=`${budgetUsedPct.toFixed(1)}% of budget used`;$('#addedMetric').textContent=money(added);"
          if old_budget not in s:
              raise SystemExit('renderBudget summary target not found')
          s=s.replace(old_budget,new_budget,1)

          old_calendar="const ym=date.slice(0,7),day=Number(date.slice(8,10)),tx=state.transactions.filter(t=>t.date===date),spent=tx.filter(t=>t.type!=='added').reduce((a,t)=>a+t.amount,0),added=tx.filter(t=>t.type==='added').reduce((a,t)=>a+t.amount,0),bills=state.bills.filter(b=>b.due===day),tours=state.tournaments.filter(t=>t.date===date),events=state.calendarEvents.filter(e=>eventOccurrence(e,ym)===date);return{tx,spent,added,bills,tours,events}"
          new_calendar="const ym=date.slice(0,7),day=Number(date.slice(8,10)),[yy,mm]=ym.split('-').map(Number),lastDay=new Date(Date.UTC(yy,mm,0)).getUTCDate(),tx=state.transactions.filter(t=>t.date===date),spent=tx.filter(t=>t.type!=='added').reduce((a,t)=>a+t.amount,0),added=tx.filter(t=>t.type==='added').reduce((a,t)=>a+t.amount,0),bills=state.bills.filter(b=>Math.min(Number(b.due)||1,lastDay)===day),tours=state.tournaments.filter(t=>t.date===date),events=state.calendarEvents.filter(e=>eventOccurrence(e,ym)===date);return{tx,spent,added,bills,tours,events}"
          if old_calendar not in s:
              raise SystemExit('calendarDayData target not found')
          s=s.replace(old_calendar,new_calendar,1)

          p.write_text(s)
          PY
      - name: Commit app update
        run: |
          git config user.name 'Budget App Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix short-month bills and show budget used percent'
          git push
