name: Lock daily spending allowance

on:
  push:
    paths:
      - '.github/workflows/lock-daily-allowance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch locked daily allowance behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const defaultState={budget:900,mpg:20,gasPrice:3.99,startDate:'',daysEnded:0,transactions:[],debts:[],cornActual:[],tournaments:[],history:[],workItems:[],houseItems:[],babyItems:[],bills:[],billMonth:'2026-09',billPayments:{},selectedStatement:'',savingsBalance:0,savingsInitialized:false,savingsHistory:[],calendarEvents:[],completedDays:[],calendarMonth:'',selectedCalendarDate:'',smokeSupplyPacks:0,smokeSupplyBaseline:0,smokePurchases:[],smokeOpens:[],selectedSmokeMonth:''};"
          new="const defaultState={budget:900,mpg:20,gasPrice:3.99,startDate:'',daysEnded:0,dailyAllowanceDate:'',dailyAllowanceStart:null,transactions:[],debts:[],cornActual:[],tournaments:[],history:[],workItems:[],houseItems:[],babyItems:[],bills:[],billMonth:'2026-09',billPayments:{},selectedStatement:'',savingsBalance:0,savingsInitialized:false,savingsHistory:[],calendarEvents:[],completedDays:[],calendarMonth:'',selectedCalendarDate:'',smokeSupplyPacks:0,smokeSupplyBaseline:0,smokePurchases:[],smokeOpens:[],selectedSmokeMonth:''};"
          if old not in s:
              raise SystemExit('defaultState target not found')
          s=s.replace(old,new,1)

          old2="const todayBudgetTx=currentDate?activeTx().filter(t=>t.countBudget&&t.date===currentDate):[],todaySpent=todayBudgetTx.filter(t=>t.type!=='added').reduce((a,t)=>a+t.amount,0),todayAdded=todayBudgetTx.filter(t=>t.type==='added').reduce((a,t)=>a+t.amount,0),startOfDayAvailable=available+todaySpent-todayAdded,startOfDayLimit=days?Math.max(0,startOfDayAvailable)/days:0,todayRemaining=Math.max(0,startOfDayLimit-todaySpent+todayAdded);$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);$('#addedMetric').textContent=money(added);$('#remainingMetric').textContent=money(available);$('#remainingMetric').className='metric '+(available>=0?'good':'bad');$('#daysMetric').textContent=days;$('#dailyLimit').textContent=money(todayRemaining);$('#budgetProgress').style.width=Math.min(100,Math.max(0,spent/Math.max(1,state.budget+added)*100))+'%';"
          new2="const todayBudgetTx=currentDate?activeTx().filter(t=>t.countBudget&&t.date===currentDate):[],todaySpent=todayBudgetTx.filter(t=>t.type!=='added').reduce((a,t)=>a+t.amount,0),todayAdded=todayBudgetTx.filter(t=>t.type==='added').reduce((a,t)=>a+t.amount,0);if(currentDate&&days>0&&(state.dailyAllowanceDate!==currentDate||state.dailyAllowanceStart===null||!Number.isFinite(Number(state.dailyAllowanceStart)))){const startOfDayAvailable=available+todaySpent-todayAdded;state.dailyAllowanceDate=currentDate;state.dailyAllowanceStart=Math.max(0,startOfDayAvailable)/days;save();}const lockedStart=Number(state.dailyAllowanceStart)||0,todayRemaining=Math.max(0,lockedStart-todaySpent+todayAdded);$('#budgetMetric').textContent=money(state.budget);$('#spentMetric').textContent=money(spent);$('#addedMetric').textContent=money(added);$('#remainingMetric').textContent=money(available);$('#remainingMetric').className='metric '+(available>=0?'good':'bad');$('#daysMetric').textContent=days;$('#dailyLimit').textContent=money(todayRemaining);$('#budgetProgress').style.width=Math.min(100,Math.max(0,spent/Math.max(1,state.budget+added)*100))+'%';"
          if old2 not in s:
              raise SystemExit('renderBudget target not found')
          s=s.replace(old2,new2,1)

          old3="state.daysEnded++;save();renderAll();status(state.daysEnded<14?`Ended ${niceDate(date)}.`:'14-day period complete. Start your next paycheck period when ready.')"
          new3="state.daysEnded++;state.dailyAllowanceDate='';state.dailyAllowanceStart=null;save();renderAll();status(state.daysEnded<14?`Ended ${niceDate(date)}.`:'14-day period complete. Start your next paycheck period when ready.')"
          if old3 not in s:
              raise SystemExit('End Day target not found')
          s=s.replace(old3,new3,1)

          old4="state.startDate=d;state.daysEnded=0;$('#spendDate').value=d;"
          new4="state.startDate=d;state.daysEnded=0;state.dailyAllowanceDate='';state.dailyAllowanceStart=null;$('#spendDate').value=d;"
          if old4 not in s:
              raise SystemExit('period reset target not found')
          s=s.replace(old4,new4,1)

          p.write_text(s)
          PY
      - name: Commit locked allowance update
        run: |
          git config user.name 'Budget App Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Lock daily spending allowance until End Day'
          git push
